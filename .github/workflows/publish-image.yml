name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  ghcr:
    name: Publish to GHCR
    needs: checks
    # Release refs and manual default-branch runs only; never PR code.
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      tag: ${{ steps.names.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select image tag
        id: names
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(tr -d '[:space:]' < VERSION)
          if [[ "$EVENT" == release ]]; then
            tag="$RELEASE_TAG"
            [[ "${tag#v}" == "$version" ]] || {
              echo 'Release tag must match VERSION (optional v prefix).' >&2; exit 1;
            }
          else
            tag="sha-${GITHUB_SHA::12}"
          fi
          [[ "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || {
            echo 'Invalid image tag.' >&2; exit 1;
          }
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          # The Go build and dictation engine currently target amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          build-args: VERSION=${{ steps.names.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image

      - name: Record published image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2016
          printf 'GHCR image: `%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  dockerhub:
    name: Mirror to Docker Hub
    needs: ghcr
    # Enabled unless explicitly disabled in repository variables.
    if: vars.DOCKERHUB_MIRROR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate mirror configuration
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'strongnetwork/knowledge-worker-agent' }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*$ ]] || {
            echo 'Set DOCKERHUB_IMAGE to namespace/repository.' >&2; exit 1;
          }
          [[ -n "$USERNAME" && -n "$TOKEN" ]] || {
            echo 'Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.' >&2; exit 1;
          }

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the published image without rebuilding
        env:
          SOURCE: ${{ needs.ghcr.outputs.image }}
          DIGEST: ${{ needs.ghcr.outputs.digest }}
          TARGET: ${{ vars.DOCKERHUB_IMAGE || 'strongnetwork/knowledge-worker-agent' }}
          TAG: ${{ needs.ghcr.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "docker.io/$TARGET:$TAG" "$SOURCE@$DIGEST"
          # shellcheck disable=SC2016
          printf 'Docker Hub mirror: `%s:%s`\n' "$TARGET" "$TAG" >> "$GITHUB_STEP_SUMMARY"
