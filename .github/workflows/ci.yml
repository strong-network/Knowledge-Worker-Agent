name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Frontend type-check and build first (the Go server embeds it), then vet,
      # build, test and govulncheck. A new Go advisory can fail CI without a code
      # change.
      - name: Build & test
        run: make ci

      - name: Build release binary
        run: make build
